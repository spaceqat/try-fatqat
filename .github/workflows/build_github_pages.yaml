name: GitHub Pages Build

on:
  push:
  pull_request:
  workflow_dispatch:
  # Pick up new FatQat releases.
  schedule:
    - cron: "23 3 * * *"

defaults:
  run:
    shell: bash -l {0}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: try-fatqat-build
          environment-file: environment.yml

      - name: Test tutorial selection
        run: python -m unittest discover -s tests -v

      - name: Prepare the latest FatQat release
        run: python scripts/sync_fatqat.py

      - name: Build JupyterLite
        run: |
          ./scripts/jl-build
          touch _output/.nojekyll

      - name: Set up browser checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install browser checks
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run tutorials in WebAssembly (five minutes each)
        run: npm run test:browser

      - name: Save browser timings and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tutorial-report
          path: |
            browser-report.json
            tutorial-manifest.json

      - name: Build only tutorials that passed
        run: |
          python scripts/sync_fatqat.py --apply-report browser-report.json
          JUPYTERLITE_OUTPUT_DIR=_validated ./scripts/jl-build
          touch _validated/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _validated

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
